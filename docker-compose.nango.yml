services:
  nango-db:
    image: postgres:16.0-alpine
    container_name: nango-db
    environment:
      POSTGRES_PASSWORD: ${NANGO_DB_PASSWORD:-nango}
      POSTGRES_USER: ${NANGO_DB_USER:-nango}
      POSTGRES_DB: ${NANGO_DB_NAME:-nango}
    ports:
      - '5433:5432'
    volumes:
      - ./nango-data:/var/lib/postgresql/data
    networks:
      - nango

  nango-redis:
    image: redis:7.2.4
    container_name: nango-redis
    ports:
      - '6380:6379'
    networks:
      - nango

  nango-server:
    image: nangohq/nango-server:hosted
    container_name: nango-server
    platform: linux/amd64
    environment:
      - NANGO_ENCRYPTION_KEY
      - NANGO_DB_USER=${NANGO_DB_USER:-nango}
      - NANGO_DB_PASSWORD=${NANGO_DB_PASSWORD:-nango}
      - NANGO_DB_HOST=${NANGO_DB_HOST:-nango-db}
      - NANGO_DB_PORT=${NANGO_DB_PORT:-5432}
      - NANGO_DB_NAME=${NANGO_DB_NAME:-nango}
      - RECORDS_DATABASE_URL=postgresql://${NANGO_DB_USER:-nango}:${NANGO_DB_PASSWORD:-nango}@nango-db:5432/${NANGO_DB_NAME:-nango}
      - NANGO_SERVER_URL=${NANGO_HOST:-http://localhost:3003}
      - NANGO_PUBLIC_SERVER_URL=${NANGO_HOST:-http://localhost:3003}
      - NANGO_DASHBOARD_USERNAME=${NANGO_DASHBOARD_USERNAME:-admin}
      - NANGO_DASHBOARD_PASSWORD=${NANGO_DASHBOARD_PASSWORD}
      - NANGO_REDIS_URL=redis://nango-redis:6379
      - NANGO_LOGS_ENABLED=false
      - FLAG_SERVE_CONNECT_UI=true
      - LOG_LEVEL=info
      - CSP_REPORT_ONLY=true
    restart: always
    ports:
      - '3003:8080'
      - '3009:3009'
    depends_on:
      - nango-db
      - nango-redis
    networks:
      - nango

networks:
  nango:

volumes:
  nango-data:
    driver: local
