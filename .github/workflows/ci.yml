name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

env:
  CI: true
  NX_NO_CLOUD: true
  DATABASE_URL: postgres://zuko_ci:zuko_ci_password@localhost:5432/zuko_ci
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'abc123' }}
  AGENTS_LLM_MODEL: ${{ vars.AGENTS_LLM_MODEL || 'gpt-4o' }}
  GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID || 'github-client-id' }}
  GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET || 'github-client-secret' }}
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-secret-for-e2e' }}
  NEXT_PUBLIC_BETTER_AUTH_INCLUDE_EMAILS_AUTH: ${{ secrets.NEXT_PUBLIC_BETTER_AUTH_INCLUDE_EMAILS_AUTH || 'true' }}
  BETTER_AUTH_INCLUDE_EMAILS_AUTH: ${{ secrets.BETTER_AUTH_INCLUDE_EMAILS_AUTH || 'true' }}
  NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
  NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL || 'http://localhost:3001' }}
  NEXT_PUBLIC_USE_AUTH_PROXY: ${{ vars.NEXT_PUBLIC_USE_AUTH_PROXY || 'true' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: zuko_ci
          POSTGRES_PASSWORD: zuko_ci_password
          POSTGRES_USER: zuko_ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # Set base and head SHAs for nx affected commands
      # - On PRs: uses merge-base (where branch forked from main)
      # - On main: uses last successful CI run
      - uses: nrwl/nx-set-shas@v4

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install chromium browser
        run: bunx playwright install chromium --with-deps

      - name: Generate Prisma client
        run: bunx nx run @zuko/models:prisma:generate

      - name: Migrate Prisma (deploy)
        run: bunx prisma migrate deploy
        working-directory: libs/models

      - name: Seed E2E test data
        run: bunx nx run @zuko/models:seed

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud

      # Lint & Format (parallel)
      - name: Lint
        run: bunx nx affected -t lint --parallel=3 --nxBail

      # Dead code check
      # TODO: remove continue-on-error once existing dead code is resolved
      - name: Knip
        continue-on-error: true
        run: bunx knip

      # typecheck & Build (parallel)
      - name: Typecheck
        run: bunx nx affected -t typecheck --parallel=50% --nxBail

      - name: Build
        run: bunx nx affected -t build --parallel=50% --nxBail

      # Tests (Sequential)
      - name: Unit tests
        run: bunx nx affected -t test --parallel=1 --nxBail

      - name: E2E tests
        run: bunx nx affected -t e2e --exclude=backend-e2e --exclude=ai-agents-e2e --nxBail

      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: bunx nx fix-ci
        if: always()
