# fly.toml app configuration file generated for meeting-bot on 2025-05-13T18:44:23+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'meeting-bot'
primary_region = 'sin'

[build]

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 2

# Enforce single instance
[scale]
count = 1
regions = ["sin"]

